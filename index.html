<!DOCTYPE html>
<html lang="az">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>WebCord - Lite Discord</title>
  <script src="/socket.io/socket.io.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background-color: #313338; color: #dbdee1; display: flex; height: 100vh; overflow: hidden; }

    /* Login Modal */
    #login-screen {
      position: fixed; top:0; left:0; width:100%; height:100%;
      background: #1e1f22; display: flex; align-items: center; justify-content: center; z-index: 999;
    }
    .login-box {
      background: #2b2d31; padding: 25px; border-radius: 8px; text-align: center; width: 90%; max-width: 350px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.5);
    }
    .login-box h2 { color: #fff; margin-bottom: 15px; }
    .login-box input {
      width: 100%; padding: 12px; border-radius: 4px; border: none; background: #1e1f22; color: #fff;
      margin-bottom: 15px; outline: none; font-size: 16px;
    }
    .login-box button {
      width: 100%; padding: 12px; border: none; background: #5865f2; color: #fff; font-weight: bold;
      border-radius: 4px; cursor: pointer; font-size: 16px; transition: 0.2s;
    }
    .login-box button:hover { background: #4752c4; }

    /* App Layout */
    .sidebar-servers { width: 60px; background: #1e1f22; display: flex; flex-direction: column; align-items: center; padding-top: 10px; }
    .server-icon {
      width: 42px; height: 42px; background: #5865f2; border-radius: 50%; display: flex;
      align-items: center; justify-content: center; color: #fff; font-weight: bold; margin-bottom: 10px; cursor: pointer;
    }

    .sidebar-channels { width: 160px; background: #2b2d31; display: flex; flex-direction: column; }
    .channel-header { padding: 15px; font-size: 14px; font-weight: bold; border-bottom: 1px solid #1f2023; color: #fff; }
    .channel-list { list-style: none; padding: 10px; flex: 1; }
    .channel-item {
      padding: 8px; border-radius: 4px; color: #949ba4; cursor: pointer; margin-bottom: 4px; font-size: 14px;
    }
    .channel-item.active, .channel-item:hover { background: #35373c; color: #fff; }

    .chat-area { flex: 1; display: flex; flex-direction: column; background: #313338; }
    .chat-header { height: 48px; border-bottom: 1px solid #232428; display: flex; align-items: center; padding: 0 15px; font-weight: bold; color: #fff; }
    
    .messages-container { flex: 1; padding: 15px; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; }
    .message { display: flex; flex-direction: column; }
    .message-author { font-size: 13px; font-weight: bold; color: #f2f3f5; margin-bottom: 2px; }
    .message-author span { font-size: 10px; color: #949ba4; margin-left: 6px; font-weight: normal; }
    .message-text { font-size: 14px; color: #dbdee1; word-break: break-word; }

    .input-area { padding: 10px 15px; background: #313338; }
    .input-box {
      background: #383a40; border-radius: 8px; display: flex; align-items: center; padding: 0 10px;
    }
    .input-box input {
      flex: 1; background: transparent; border: none; outline: none; padding: 12px; color: #fff; font-size: 14px;
    }
    .input-box button {
      background: #5865f2; color: #fff; border: none; padding: 8px 14px; border-radius: 4px; font-weight: bold; cursor: pointer;
    }

    /* Mobil Uyğunlaşdırma */
    @media (max-width: 600px) {
      .sidebar-servers { width: 50px; }
      .sidebar-channels { width: 120px; }
    }
  </style>
</head>
<body>

  <!-- Giriş Ekranı -->
  <div id="login-screen">
    <div class="login-box">
      <h2>WebCord-a Xoş Qəldiniz</h2>
      <input type="text" id="username-input" placeholder="Ləqəbinizi yazın..." maxlength="15">
      <button onclick="login()">Daxil ol</button>
    </div>
  </div>

  <!-- Sol Server Bölməsi -->
  <div class="sidebar-servers">
    <div class="server-icon">WC</div>
  </div>

  <!-- Kanallar Bölməsi -->
  <div class="sidebar-channels">
    <div class="channel-header">WebCord Server</div>
    <ul class="channel-list">
      <li class="channel-item active" onclick="switchChannel('ümumi', this)"># ümumi</li>
      <li class="channel-item" onclick="switchChannel('sohbət', this)"># sohbət</li>
      <li class="channel-item" onclick="switchChannel('oyunlar', this)"># oyunlar</li>
      <li class="channel-item" onclick="switchChannel('musiqi', this)"># musiqi</li>
    </ul>
  </div>

  <!-- Çat Bölməsi -->
  <div class="chat-area">
    <div class="chat-header" id="current-channel-title"># ümumi</div>
    <div class="messages-container" id="messages"></div>
    <div class="input-area">
      <div class="input-box">
        <input type="text" id="message-input" placeholder="Mesaj yazın..." onkeydown="if(event.key==='Enter') sendMessage()">
        <button onclick="sendMessage()">Göndər</button>
      </div>
    </div>
  </div>

  <script>
    const socket = io();
    let currentChannel = "ümumi";
    let myUsername = "";

    function login() {
      const input = document.getElementById("username-input");
      if (input.value.trim() !== "") {
        myUsername = input.value.trim();
        document.getElementById("login-screen").style.display = "none";
        socket.emit("join", myUsername);
      }
    }

    function switchChannel(channelName, element) {
      if (currentChannel === channelName) return;
      
      document.querySelectorAll('.channel-item').forEach(el => el.classList.remove('active'));
      element.classList.add('active');

      socket.emit("switch-channel", { oldChannel: currentChannel, newChannel: channelName });
      currentChannel = channelName;
      document.getElementById("current-channel-title").innerText = "# " + channelName;
      document.getElementById("messages").innerHTML = "";
    }

    function sendMessage() {
      const input = document.getElementById("message-input");
      if (input.value.trim() !== "") {
        socket.emit("send-message", { channel: currentChannel, text: input.value.trim() });
        input.value = "";
      }
    }

    socket.on("load-messages", (messages) => {
      const container = document.getElementById("messages");
      container.innerHTML = "";
      messages.forEach(msg => appendMessage(msg));
      container.scrollTop = container.scrollHeight;
    });

    socket.on("new-message", (msg) => {
      appendMessage(msg);
      const container = document.getElementById("messages");
      container.scrollTop = container.scrollHeight;
    });

    function appendMessage(msg) {
      const container = document.getElementById("messages");
      const msgDiv = document.createElement("div");
      msgDiv.className = "message";
      msgDiv.innerHTML = `
        <div class="message-author">${msg.user} <span>${msg.time}</span></div>
        <div class="message-text">${escapeHtml(msg.text)}</div>
      `;
      container.appendChild(msgDiv);
    }

    function escapeHtml(text) {
      return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }
  </script>
</body>
</html>
